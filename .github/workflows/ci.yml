name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore
      - name: Build (analyzers on)
        run: dotnet build -c Release --no-restore
      - name: Test (includes script, installer and workflow checks)
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Package both modules and verify artifacts (no installer on CI)
        shell: pwsh
        run: ./scripts/build.ps1 -Version 0.0.0 -SkipTests
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: '**/results.trx' }
